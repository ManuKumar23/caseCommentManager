<template>
    <lightning-card title="Case Comments">
        <template lwc:if={caseCommentData.length}>
            <div class="commentsContainer">
                <template for:each={caseCommentData} for:item="caseComment">
                    <div class="commentContainer" key={caseComment.Id}>
                        <div>{caseComment.CreatedBy.Name}</div>
                        <div>{caseComment.CommentBody}</div>
                        <div>{caseComment.CreatedDate}</div>
                    </div>
                </template>
                <template lwc:if={displayLoadMore}>
                    <lightning-button label="Load More" onclick={handleLoadMore}></lightning-button>
                </template>
            </div>
        </template>
        <template lwc:else>
            <p class="commentsContainer">No Comments</p>
        </template>
    </lightning-card>
</template>
